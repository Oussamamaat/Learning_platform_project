# Builds config/Dockerfile.vllm (the production `llm` service, ADR 0011) and pushes it to GHCR.
name: Build vLLM image

on:
  workflow_dispatch: {}
  push:
    branches: [main, vllm-migration]
    paths:
      - config/Dockerfile.vllm
      - scripts/vllm/serve_pair.sh
      - scripts/vllm/llm_entrypoint.sh
      - .github/workflows/build-vllm-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The vllm/vllm-openai base is ~9 GB compressed; the default runner disk is too small to unpack it.
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: config/Dockerfile.vllm
          push: true
          platforms: linux/amd64
          provenance: false
          # Point the SDL at the sha tag: Akash nodes cache non-":latest" tags (see build-gpu-image.yml).
          tags: |
            ghcr.io/oussamamaat/iblog-vllm:${{ github.ref_name }}
            ghcr.io/oussamamaat/iblog-vllm:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/oussamamaat/iblog-vllm:buildcache
          cache-to: type=registry,ref=ghcr.io/oussamamaat/iblog-vllm:buildcache,mode=max
