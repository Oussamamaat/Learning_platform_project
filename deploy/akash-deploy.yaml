---
# ═════════════════════════════════════════════════════════════════════════════
# Akash SDL — IBLOG Tutor production deployment, vLLM serving (ADR 0011)
# ═════════════════════════════════════════════════════════════════════════════
# One lease, three services:
#   db  — Postgres/pgvector, CPU only
#   llm — vLLM serving both tutors (Darija :8101, French :8102) on one RTX 5090,
#         reachable only from `app`
#   app — FastAPI + STT/TTS/OCR on its own GPU, with LLM_BACKEND=vllm
# Heavy OCR/voice and LLM serving get separate cards, as
# docs/architecture/cloud-scaling-plan.md §3 recommends: sharing one 32 GB card
# would leave vLLM about 2 concurrent requests per language.
#
# Rollback to Ollama: deploy deploy/akash-deploy.ollama.yaml instead. The app
# image is the same; only LLM_BACKEND and the services differ.
#
# Storage is ephemeral. On 2026-09-11 neither beta3 nor beta2 persistent volumes
# drew a single rtx5090 bid, so `llm` downloads its ~12 GB of AWQ weights on
# every container start (a few minutes), and `app` its XTTS checkpoint.
#
# THIS FILE IS THE COMMITTED TEMPLATE — it must stay free of real secrets.
# Render with:
#     HF_READ_TOKEN=hf_xxx bash deploy/make-local-sdl.sh deploy/akash-deploy.yaml
# and deploy deploy/akash-deploy.local.yaml (gitignored).
#
# BEFORE DEPLOYING:
#   1. Both GHCR packages (iblog-tutor, iblog-vllm) must be public: Akash pulls
#      anonymously.
#   2. Pin both images to the sha tags CI pushed. Provider nodes cache any
#      non-":latest" tag, so a mutable tag can silently run an old build.
#   3. HF_TOKEN is a fine-grained READ token for Oussamamaat/iblog-tutor-awq.
#   4. Pricing ceilings are in uakt per block (about 590 blocks per hour). At
#      AKT = $0.54 (2026-09-11), 20000 is about $6.40/h. You pay the bid you
#      accept, not the ceiling.
# ═════════════════════════════════════════════════════════════════════════════

version: "2.0"

services:
  db:
    image: pgvector/pgvector:pg16
    env:
      - POSTGRES_USER=assistant
      - POSTGRES_PASSWORD=CHANGE_ME_strong_password
      - POSTGRES_DB=iblog_assistant
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - port: 5432
        # `as` must be explicit: Akash defaults it to 80, which publishes
        # Postgres as db:80 while DATABASE_URL says db:5432.
        as: 5432
        to:
          - service: app

  llm:
    # Pin before deploying, e.g. ghcr.io/oussamamaat/iblog-vllm:vllm-migration-<sha>
    image: ghcr.io/oussamamaat/iblog-vllm:vllm-migration
    env:
      - HF_TOKEN=PASTE_A_READ_ONLY_HF_TOKEN
      - AWQ_REPO=Oussamamaat/iblog-tutor-awq
      # KV cache per instance, computed in ADR 0011 (confirm from vLLM's startup
      # log). Uppercase G means GiB: vLLM reads "6g" as 10^9 bytes.
      - DARIJA_KV_BYTES=6G
      - FRENCH_KV_BYTES=6G
      - VLLM_EXTRA_ARGS=--max-num-seqs 16
      - NVIDIA_DISABLE_REQUIRE=true
    expose:
      - port: 8101
        as: 8101
        to:
          - service: app
      - port: 8102
        as: 8102
        to:
          - service: app

  app:
    # Pin before deploying, e.g. ghcr.io/oussamamaat/iblog-tutor:vllm-migration-<sha>
    image: ghcr.io/oussamamaat/iblog-tutor:vllm-migration
    env:
      # ── wiring ──────────────────────────────────────────────────────────
      - DATABASE_URL=postgresql://assistant:CHANGE_ME_strong_password@db:5432/iblog_assistant
      - LLM_BACKEND=vllm
      - LLM_BASE_URL=http://llm:8101
      - LLM_BASE_URL_FR=http://llm:8102
      # ── Linux venv interpreters (override the Windows defaults) ──────────
      - OCR_VENV_PYTHON=/app/.ocr_venv/bin/python
      - STT_VENV_PYTHON=/app/.speech_venv/bin/python
      - TTS_XTTS_VENV_PYTHON=/app/.tts_venv/bin/python
      # ── engines ─────────────────────────────────────────────────────────
      # seamless: ADR 0009 (Darija WER 0.428 vs whisper's 0.699).
      - STT_ENGINE=seamless
      # xtts_darija is an evaluation setting (ADR 0006: XTTS-v2's CPML licence);
      # use piper for anything customer-facing.
      - TTS_ENGINE=xtts_darija
      - TTS_XTTS_MODEL_DIR=/models/darija_xtts
      - STT_MODEL=large-v3
      # The web-search fallback needs gemma2:9b on Ollama, which this layout does not run.
      - WEB_SEARCH_ENGINE=none
      - OCR_ENGINE=paddleocr
      # ── relaxations for a card with VRAM to spare ────────────────────────
      - OCR_KEEP_RESIDENT=true
      - OCR_WORKER_IDLE_RELEASE_SECONDS=0
      - SPEECH_WORKER_IDLE_RELEASE_SECONDS=0
      - TTS_WORKER_IDLE_RELEASE_SECONDS=0
      - EMBEDDING_BATCH_SIZE=128
      # A too-new host driver can otherwise refuse to start the container.
      - NVIDIA_DISABLE_REQUIRE=true
      # ── safety on a publicly-reachable, auth-less app ───────────────────
      - UPLOADS_READ_ONLY=true
    expose:
      - port: 8000
        as: 80
        to:
          - global: true

profiles:
  compute:
    db:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage:
          - size: 30Gi
    llm:
      resources:
        cpu:
          units: 8
        memory:
          size: 32Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: rtx5090
        storage:
          - size: 60Gi   # vLLM image (~20 GB unpacked) + AWQ weights (12.3 GB) + logs
    app:
      resources:
        cpu:
          units: 8
        memory:
          size: 48Gi     # seamless + resident PaddleOCR + bge-m3 + XTTS load in host RAM first
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                - model: rtx8000
                - model: rtx5090
                - model: pro6000se
        storage:
          - size: 100Gi  # app image (~55 GB unpacked) + STT weights (3-9 GB) + XTTS (5.6 GB)
  placement:
    dcloud:
      pricing:
        db:
          denom: uakt
          amount: 1000
        llm:
          denom: uakt
          amount: 20000
        app:
          denom: uakt
          amount: 12000

deployment:
  db:
    dcloud:
      profile: db
      count: 1
  llm:
    dcloud:
      profile: llm
      count: 1
  app:
    dcloud:
      profile: app
      count: 1
